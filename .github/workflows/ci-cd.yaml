name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  REGISTRY: docker.io
  DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
  DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
  KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
  KUBE_NAMESPACE: default

jobs:
  # ========== LINT & TEST JOBS ==========
  lint-frontend:
    runs-on: ubuntu-latest
    name: Lint Frontend (Astro)
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'Frontend/package-lock.json'

      - name: Install Frontend Dependencies
        run: cd Frontend && npm ci

      - name: Build Frontend Check
        run: cd Frontend && npm run build
        continue-on-error: true

  lint-backend:
    runs-on: ubuntu-latest
    name: Lint Backend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'server/package-lock.json'

      - name: Install Backend Dependencies
        run: cd server && npm ci

      - name: Dependency Check
        run: cd server && npm list --depth=0

  # ========== BUILD JOBS (Parallel) ==========
  build-frontend:
    needs: lint-frontend
    runs-on: ubuntu-latest
    name: Build Frontend Image
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKER_USERNAME }}/astro-frontend
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and Push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./Frontend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-backend:
    needs: lint-backend
    runs-on: ubuntu-latest
    name: Build Backend Image
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKER_USERNAME }}/astro-backend
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and Push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./server
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ========== DEPLOYMENT JOB ==========
  deploy:
    needs: [build-frontend, build-backend]
    runs-on: ubuntu-latest
    name: Deploy to Kubernetes
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4

      - name: Configure kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > $HOME/.kube/config
          chmod 600 $HOME/.kube/config
          kubectl cluster-info

      - name: Update Frontend Deployment Image
        run: |
          FRONTEND_IMAGE=$(echo "${{ needs.build-frontend.outputs.image-tag }}" | head -1)
          kubectl set image deployment/astro-deployment \
            astro=$FRONTEND_IMAGE \
            -n ${{ env.KUBE_NAMESPACE }} \
            --record

      - name: Update Backend Deployment Image
        run: |
          BACKEND_IMAGE=$(echo "${{ needs.build-backend.outputs.image-tag }}" | head -1)
          kubectl set image deployment/backend-v2-deployment \
            backend-v2=$BACKEND_IMAGE \
            -n ${{ env.KUBE_NAMESPACE }} \
            --record

      - name: Wait for Frontend Rollout
        run: |
          kubectl rollout status deployment/astro-deployment \
            -n ${{ env.KUBE_NAMESPACE }} \
            --timeout=5m

      - name: Wait for Backend Rollout
        run: |
          kubectl rollout status deployment/backend-v2-deployment \
            -n ${{ env.KUBE_NAMESPACE }} \
            --timeout=5m

      - name: Health Check - Frontend
        run: |
          FRONTEND_IP=$(kubectl get svc astro-service -o jsonpath='{.status.loadBalancer.ingress[0].ip}' \
            -n ${{ env.KUBE_NAMESPACE }})
          for i in {1..30}; do
            if curl -f http://$FRONTEND_IP || true; then
              echo "Frontend is healthy"
              exit 0
            fi
            sleep 10
          done
          echo "Frontend health check failed"
          exit 1

      - name: Health Check - Backend
        run: |
          BACKEND_IP=$(kubectl get svc backend-v2-service -o jsonpath='{.status.loadBalancer.ingress[0].ip}' \
            -n ${{ env.KUBE_NAMESPACE }})
          for i in {1..30}; do
            if curl -f http://$BACKEND_IP/api/v1/healthCheck; then
              echo "Backend is healthy"
              exit 0
            fi
            sleep 10
          done
          echo "Backend health check failed"
          exit 1

      - name: Verify Deployment Status
        run: |
          echo "=== Frontend Deployment ==="
          kubectl get deployment astro-deployment -n ${{ env.KUBE_NAMESPACE }} -o wide
          echo ""
          echo "=== Backend Deployment ==="
          kubectl get deployment backend-v2-deployment -n ${{ env.KUBE_NAMESPACE }} -o wide
          echo ""
          echo "=== Services ==="
          kubectl get svc -n ${{ env.KUBE_NAMESPACE }} -o wide

      - name: Rollback on Failure
        if: failure()
        run: |
          echo "Deployment failed, initiating rollback..."
          kubectl rollout undo deployment/astro-deployment -n ${{ env.KUBE_NAMESPACE }}
          kubectl rollout undo deployment/backend-v2-deployment -n ${{ env.KUBE_NAMESPACE }}
          kubectl rollout status deployment/astro-deployment -n ${{ env.KUBE_NAMESPACE }} --timeout=5m
          kubectl rollout status deployment/backend-v2-deployment -n ${{ env.KUBE_NAMESPACE }} --timeout=5m
          exit 1

  # ========== NOTIFICATIONS ==========
  notify:
    needs: [deploy]
    runs-on: ubuntu-latest
    name: Send Notifications
    if: always()
    steps:
      - name: Send Success Notification
        if: needs.deploy.result == 'success'
        run: echo "✅ Deployment completed successfully!"

      - name: Send Failure Notification
        if: needs.deploy.result == 'failure'
        run: echo "❌ Deployment failed! Check logs for details."